<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Abbey Stitches Empire | Product Details</title>
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Font Awesome Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
  <!-- Google Fonts -->
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&family=Playfair+Display:ital,wght@0,600;0,700;1,400&display=swap" rel="stylesheet" />

  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            brand: {
              navy: '#06132b',
              dark: '#030a17',
              gold: '#d4af37',
              goldLight: '#f3e5ab',
              whatsapp: '#25D366'
            }
          },
          fontFamily: {
            sans: ['"Plus Jakarta Sans"', 'sans-serif'],
            serif: ['"Playfair Display"', 'serif']
          }
        }
      }
    };
  </script>
</head>
<body class="bg-gray-100 font-sans antialiased text-gray-900 pb-20 md:pb-6">

  <!-- Main Container -->
  <div class="max-w-md md:max-w-5xl mx-auto bg-white min-h-screen shadow-xl relative overflow-hidden">

    <!-- Top Floating Header Controls -->
    <div class="absolute top-4 left-4 right-4 z-30 flex items-center justify-between pointer-events-none">
      <a href="shop.html" class="w-9 h-9 rounded-full bg-brand-dark/70 backdrop-blur-md flex items-center justify-center text-white pointer-events-auto hover:bg-brand-dark transition">
        <i class="fa-solid fa-arrow-left text-sm"></i>
      </a>
      <div class="flex items-center gap-2 pointer-events-auto">
        <button class="w-9 h-9 rounded-full bg-white/80 backdrop-blur-md flex items-center justify-center text-gray-700 hover:text-red-500 transition shadow-sm">
          <i class="fa-regular fa-heart text-sm"></i>
        </button>
        <button class="w-9 h-9 rounded-full bg-brand-dark/70 backdrop-blur-md flex items-center justify-center text-white hover:bg-brand-dark transition">
          <i class="fa-solid fa-share-nodes text-sm"></i>
        </button>
      </div>
    </div>

    <!-- Main Content Grid -->
    <main class="grid grid-cols-1 md:grid-cols-2 gap-0 md:gap-6">

      <!-- Hero Product Image / Gallery -->
      <div class="relative w-full aspect-[4/5] bg-gray-100 overflow-hidden md:rounded-b-2xl">
        <img id="product-img" src="scrn3.png" alt="Product Image" class="w-full h-full object-cover object-top" onerror="this.src='scrn1.png'" />
        
        <!-- Image Dots Indicator -->
        <div class="absolute bottom-3 left-0 right-0 flex justify-center gap-1.5 z-10">
          <span class="w-2 h-2 rounded-full bg-white"></span>
          <span class="w-1.5 h-1.5 rounded-full bg-white/50"></span>
          <span class="w-1.5 h-1.5 rounded-full bg-white/50"></span>
          <span class="w-1.5 h-1.5 rounded-full bg-white/50"></span>
        </div>
      </div>

      <!-- Details & Actions Section -->
      <div class="p-5 flex flex-col gap-5">
        
        <!-- Title & Price Block -->
        <div>
          <span id="product-category" class="px-2.5 py-1 bg-amber-100 text-amber-900 text-[10px] font-bold rounded-full uppercase tracking-wider">Ready-to-Wear</span>
          <h1 id="product-title" class="text-base md:text-xl font-bold text-gray-900 leading-snug mt-2">
            Elegant Peplum Top & Skirt Set
          </h1>
          <div class="flex items-center justify-between mt-1">
            <span id="product-price" class="text-lg md:text-2xl font-bold text-gray-900">₦35,000</span>
            <div class="flex items-center gap-1 text-xs text-amber-500">
              <i class="fa-solid fa-star"></i>
              <i class="fa-solid fa-star"></i>
              <i class="fa-solid fa-star"></i>
              <i class="fa-solid fa-star"></i>
              <i class="fa-solid fa-star"></i>
              <span class="text-gray-500 font-semibold text-[11px] ml-0.5">(12)</span>
            </div>
          </div>
        </div>

        <!-- Color Selector -->
        <div>
          <label class="block text-xs font-semibold text-gray-700 mb-2">Color: <span id="selected-color" class="font-normal text-gray-500">Green</span></label>
          <div class="flex items-center gap-3">
            <button onclick="setColor('Green', this)" class="color-btn w-7 h-7 rounded-full bg-emerald-700 ring-2 ring-emerald-700 ring-offset-2"></button>
            <button onclick="setColor('Red', this)" class="color-btn w-7 h-7 rounded-full bg-red-600 hover:ring-2 hover:ring-red-600 hover:ring-offset-2 transition"></button>
            <button onclick="setColor('Blue', this)" class="color-btn w-7 h-7 rounded-full bg-blue-800 hover:ring-2 hover:ring-blue-800 hover:ring-offset-2 transition"></button>
            <button onclick="setColor('Black', this)" class="color-btn w-7 h-7 rounded-full bg-black hover:ring-2 hover:ring-black hover:ring-offset-2 transition"></button>
            <button onclick="setColor('Purple', this)" class="color-btn w-7 h-7 rounded-full bg-purple-700 hover:ring-2 hover:ring-purple-700 hover:ring-offset-2 transition"></button>
          </div>
        </div>

        <!-- Size Selector -->
        <div>
          <label class="block text-xs font-semibold text-gray-700 mb-2">Size: <span id="selected-size" class="font-normal text-gray-500">M</span></label>
          <div class="grid grid-cols-5 gap-2">
            <button onclick="setSize('S', this)" class="size-btn py-2 rounded-lg text-xs font-semibold bg-gray-100 text-gray-700 hover:bg-gray-200 transition">S</button>
            <button onclick="setSize('M', this)" class="size-btn py-2 rounded-lg text-xs font-semibold bg-brand-navy text-white shadow-sm">M</button>
            <button onclick="setSize('L', this)" class="size-btn py-2 rounded-lg text-xs font-semibold bg-gray-100 text-gray-700 hover:bg-gray-200 transition">L</button>
            <button onclick="setSize('XL', this)" class="size-btn py-2 rounded-lg text-xs font-semibold bg-gray-100 text-gray-700 hover:bg-gray-200 transition">XL</button>
            <button onclick="setSize('XXL', this)" class="size-btn py-2 rounded-lg text-xs font-semibold bg-gray-100 text-gray-700 hover:bg-gray-200 transition">XXL</button>
          </div>
        </div>

        <!-- Quantity & Add to Cart CTA -->
        <div class="flex items-center gap-3">
          <!-- Quantity Counter -->
          <div class="flex items-center border border-gray-200 rounded-lg px-3 py-2 gap-4 bg-gray-50">
            <button onclick="changeQty(-1)" class="text-gray-500 hover:text-gray-800 font-bold text-sm">-</button>
            <span id="qty-val" class="text-xs font-bold text-gray-800">1</span>
            <button onclick="changeQty(1)" class="text-gray-500 hover:text-gray-800 font-bold text-sm">+</button>
          </div>

          <!-- Add to Cart Button -->
          <button onclick="addToCart()" class="flex-1 py-3 bg-brand-navy hover:bg-brand-dark text-white font-bold text-xs rounded-lg shadow-md flex items-center justify-center transition">
            Add to Cart
          </button>
        </div>

        <!-- Direct WhatsApp Order CTA -->
        <a id="whatsapp-link" href="#" target="_blank" class="w-full py-3 bg-brand-whatsapp hover:bg-emerald-600 text-white font-bold text-xs rounded-lg shadow flex items-center justify-center gap-2 transition">
          <i class="fa-brands fa-whatsapp text-lg"></i>
          <span>Order via WhatsApp</span>
        </a>

        <!-- Store Guarantees / Value Proposition Grid -->
        <div class="grid grid-cols-3 gap-2 pt-2 text-center text-[10px] text-gray-600">
          <div class="p-2.5 bg-gray-50 rounded-lg border border-gray-100 flex flex-col items-center gap-1">
            <i class="fa-solid fa-truck text-brand-navy text-sm"></i>
            <span class="font-bold text-gray-800">Free Delivery</span>
            <span class="text-[9px] text-gray-400 leading-none">(orders above ₦50,000)</span>
          </div>

          <div class="p-2.5 bg-gray-50 rounded-lg border border-gray-100 flex flex-col items-center gap-1">
            <i class="fa-solid fa-money-bill-transfer text-brand-navy text-sm"></i>
            <span class="font-bold text-gray-800">Cash on Delivery</span>
            <span class="text-[9px] text-gray-400 leading-none">(available)</span>
          </div>

          <div class="p-2.5 bg-gray-50 rounded-lg border border-gray-100 flex flex-col items-center gap-1">
            <i class="fa-solid fa-rotate-left text-brand-navy text-sm"></i>
            <span class="font-bold text-gray-800">7 Days Return</span>
            <span class="text-[9px] text-gray-400 leading-none">(conditions apply)</span>
          </div>
        </div>

      </div>

    </main>

  </div>

  <!-- Script for Product Loading & Cart Management -->
  <script>
    // Default fallback product
    let currentProduct = {
      title: "Elegant Peplum Top & Skirt Set",
      price: 35000,
      category: "Ready-to-Wear",
      image: "scrn3.png"
    };

    let quantity = 1;
    let selectedColor = "Green";
    let selectedSize = "M";

    // Read URL or localStorage for clicked product
    const urlParams = new URLSearchParams(window.location.search);
    const prodTitle = urlParams.get('title');

    if (prodTitle) {
      const allStored = JSON.parse(localStorage.getItem("abbey_products") || "[]");
      const defaultList = [
        { title: "Elegant Peplum Top & Skirt Set", category: "Corporate Wear", price: 35000, image: "scrn3.png" },
        { title: "Chic Office Dress", category: "Corporate Wear", price: 32000, image: "scrn1.png" },
        { title: "Ankara Flare Gown", category: "Ankara", price: 38000, image: "scrn2.png" }
      ];
      const found = [...allStored, ...defaultList].find(p => p.title.toLowerCase() === prodTitle.toLowerCase());
      if (found) currentProduct = found;
    }

    // Populate UI elements
    document.getElementById('product-title').textContent = currentProduct.title;
    document.getElementById('product-price').textContent = '₦' + Number(currentProduct.price).toLocaleString();
    document.getElementById('product-category').textContent = currentProduct.category || 'Outfit';
    document.getElementById('product-img').src = currentProduct.image || 'scrn3.png';

    // WhatsApp Link generator
    const waText = `Hello Abbey Stitches, I want to order the "${currentProduct.title}" (${selectedColor}, Size ${selectedSize}) priced at ₦${Number(currentProduct.price).toLocaleString()}`;
    document.getElementById('whatsapp-link').href = `https://wa.me/2347051716739?text=${encodeURIComponent(waText)}`;

    function setColor(color, btn) {
      selectedColor = color;
      document.getElementById('selected-color').textContent = color;
      document.querySelectorAll('.color-btn').forEach(b => b.classList.remove('ring-2', 'ring-offset-2'));
      btn.classList.add('ring-2', 'ring-offset-2');
    }

    function setSize(size, btn) {
      selectedSize = size;
      document.getElementById('selected-size').textContent = size;
      document.querySelectorAll('.size-btn').forEach(b => {
        b.className = "size-btn py-2 rounded-lg text-xs font-semibold bg-gray-100 text-gray-700 hover:bg-gray-200 transition";
      });
      btn.className = "size-btn py-2 rounded-lg text-xs font-semibold bg-brand-navy text-white shadow-sm";
    }

    function changeQty(val) {
      quantity += val;
      if (quantity < 1) quantity = 1;
      document.getElementById('qty-val').textContent = quantity;
    }

    function addToCart() {
      let cart = JSON.parse(localStorage.getItem("abbey_cart") || "[]");
      
      // Check if exact item already in cart
      const existingIndex = cart.findIndex(item => item.title === currentProduct.title && item.color === selectedColor && item.size === selectedSize);
      
      if (existingIndex > -1) {
        cart[existingIndex].quantity = (cart[existingIndex].quantity || 1) + quantity;
      } else {
        cart.push({
          title: currentProduct.title,
          price: currentProduct.price,
          category: currentProduct.category,
          image: currentProduct.image,
          color: selectedColor,
          size: selectedSize,
          quantity: quantity
        });
      }

      localStorage.setItem("abbey_cart", JSON.stringify(cart));
      alert(`🛒 Added ${quantity} x "${currentProduct.title}" (${selectedColor}, Size ${selectedSize}) to your cart!`);
      window.location.href = "cart.html";
    }
  </script>
</body>
</html>
