<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Abbey Stitches Empire | Custom Order Wizard</title>
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Font Awesome Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
  <!-- Google Fonts -->
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&family=Playfair+Display:ital,wght@0,600;0,700;1,400&display=swap" rel="stylesheet" />

  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            brand: {
              navy: '#06132b',
              dark: '#030a17',
              gold: '#d4af37',
              goldLight: '#f3e5ab',
              whatsapp: '#25D366'
            }
          },
          fontFamily: {
            sans: ['"Plus Jakarta Sans"', 'sans-serif'],
            serif: ['"Playfair Display"', 'serif']
          }
        }
      }
    };
  </script>
</head>
<body class="bg-gray-100 font-sans antialiased text-gray-900 pb-20 md:pb-6">

  <!-- Main Container -->
  <div class="max-w-md md:max-w-4xl mx-auto bg-white min-h-screen shadow-xl relative overflow-hidden flex flex-col justify-between">

    <!-- Top Header -->
    <header class="sticky top-0 z-40 bg-brand-navy text-white px-4 py-3 flex items-center justify-between shadow-md">
      <div class="flex items-center gap-3">
        <a href="home.html" class="text-gray-200 hover:text-white transition">
          <i class="fa-solid fa-arrow-left text-lg"></i>
        </a>
        <h1 class="text-base font-bold font-serif text-amber-200">Start Custom Sewing</h1>
      </div>
      <span class="text-xs text-yellow-500 font-semibold uppercase tracking-wider">Step 1 of 4</span>
    </header>

    <!-- Custom Order Form Wizard -->
    <main class="p-4 md:p-6 flex-1 flex flex-col gap-6">

      <!-- Step Indicator Bar -->
      <div class="flex items-center justify-between relative px-2">
        <div class="absolute top-1/2 left-4 right-4 h-0.5 bg-gray-200 -z-0 -translate-y-1/2"></div>
        <div class="w-8 h-8 rounded-full bg-brand-navy text-amber-300 font-bold text-xs flex items-center justify-center z-10 shadow">1</div>
        <div class="w-8 h-8 rounded-full bg-gray-200 text-gray-600 font-bold text-xs flex items-center justify-center z-10">2</div>
        <div class="w-8 h-8 rounded-full bg-gray-200 text-gray-600 font-bold text-xs flex items-center justify-center z-10">3</div>
        <div class="w-8 h-8 rounded-full bg-gray-200 text-gray-600 font-bold text-xs flex items-center justify-center z-10">4</div>
      </div>

      <form id="custom-order-form" onsubmit="handleCustomSubmit(event)" class="flex flex-col gap-5">
        
        <!-- Step 1: Select Outfit Type -->
        <div class="flex flex-col gap-3">
          <label class="text-xs font-bold text-gray-800 uppercase tracking-wider">1. Select Outfit Type</label>
          <div class="grid grid-cols-2 md:grid-cols-4 gap-3">
            
            <label class="outfit-card border-2 border-brand-navy bg-amber-50/50 rounded-xl p-3 flex flex-col items-center gap-2 cursor-pointer shadow-sm transition" onclick="selectOutfit('gown', this)">
              <input type="radio" name="outfit_type" value="Custom Gown" checked class="hidden" />
              <i class="fa-solid fa-person-dress text-brand-navy text-xl"></i>
              <span class="text-xs font-bold text-gray-800">Custom Gown</span>
            </label>

            <label class="outfit-card border border-gray-200 hover:border-gray-300 rounded-xl p-3 flex flex-col items-center gap-2 cursor-pointer transition" onclick="selectOutfit('two_piece', this)">
              <input type="radio" name="outfit_type" value="Two-Piece / Suit" class="hidden" />
              <i class="fa-solid fa-shirt text-gray-600 text-xl"></i>
              <span class="text-xs font-bold text-gray-800">Two-Piece / Suit</span>
            </label>

            <label class="outfit-card border border-gray-200 hover:border-gray-300 rounded-xl p-3 flex flex-col items-center gap-2 cursor-pointer transition" onclick="selectOutfit('ankara', this)">
              <input type="radio" name="outfit_type" value="Ankara Style" class="hidden" />
              <i class="fa-solid fa-vest text-gray-600 text-xl"></i>
              <span class="text-xs font-bold text-gray-800">Ankara Style</span>
            </label>

            <label class="outfit-card border border-gray-200 hover:border-gray-300 rounded-xl p-3 flex flex-col items-center gap-2 cursor-pointer transition" onclick="selectOutfit('other', this)">
              <input type="radio" name="outfit_type" value="Other Custom" class="hidden" />
              <i class="fa-solid fa-scissors text-gray-600 text-xl"></i>
              <span class="text-xs font-bold text-gray-800">Other Custom</span>
            </label>

          </div>
        </div>

        <!-- Step 2: Fabric & Design Upload -->
        <div class="flex flex-col gap-3">
          <label class="text-xs font-bold text-gray-800 uppercase tracking-wider">2. Fabric & Inspiration Image</label>
          <div onclick="document.getElementById('file-upload').click()" class="border-2 border-dashed border-gray-300 hover:border-brand-navy rounded-xl p-6 text-center flex flex-col items-center gap-2 bg-gray-50 transition cursor-pointer">
            <i id="upload-icon" class="fa-solid fa-cloud-arrow-up text-2xl text-gray-400"></i>
            <p id="upload-text" class="text-xs font-semibold text-gray-700">Click to upload design style or fabric sample</p>
            <p class="text-[10px] text-gray-400">PNG, JPG or WEBP up to 10MB</p>
            <input type="file" id="file-upload" accept="image/*" class="hidden" onchange="previewFile(this)" />
          </div>
        </div>

        <!-- Step 3: Body Measurements Inputs -->
        <div class="flex flex-col gap-3">
          <label class="text-xs font-bold text-gray-800 uppercase tracking-wider">3. Key Body Measurements (Inches)</label>
          <div class="grid grid-cols-2 md:grid-cols-3 gap-3">
            <div>
              <label class="block text-[11px] font-semibold text-gray-600 mb-1">Bust / Chest</label>
              <input type="number" id="m-bust" placeholder="e.g. 36" class="w-full px-3 py-2 bg-gray-50 border border-gray-200 rounded-lg text-xs focus:outline-none focus:ring-2 focus:ring-brand-navy" required />
            </div>
            <div>
              <label class="block text-[11px] font-semibold text-gray-600 mb-1">Waist</label>
              <input type="number" id="m-waist" placeholder="e.g. 28" class="w-full px-3 py-2 bg-gray-50 border border-gray-200 rounded-lg text-xs focus:outline-none focus:ring-2 focus:ring-brand-navy" required />
            </div>
            <div>
              <label class="block text-[11px] font-semibold text-gray-600 mb-1">Hips</label>
              <input type="number" id="m-hips" placeholder="e.g. 40" class="w-full px-3 py-2 bg-gray-50 border border-gray-200 rounded-lg text-xs focus:outline-none focus:ring-2 focus:ring-brand-navy" required />
            </div>
            <div>
              <label class="block text-[11px] font-semibold text-gray-600 mb-1">Full Length</label>
              <input type="number" id="m-length" placeholder="e.g. 58" class="w-full px-3 py-2 bg-gray-50 border border-gray-200 rounded-lg text-xs focus:outline-none focus:ring-2 focus:ring-brand-navy" required />
            </div>
            <div>
              <label class="block text-[11px] font-semibold text-gray-600 mb-1">Shoulder Width</label>
              <input type="number" id="m-shoulder" placeholder="e.g. 15" class="w-full px-3 py-2 bg-gray-50 border border-gray-200 rounded-lg text-xs focus:outline-none focus:ring-2 focus:ring-brand-navy" required />
            </div>
            <div>
              <label class="block text-[11px] font-semibold text-gray-600 mb-1">Sleeve Length</label>
              <input type="number" id="m-sleeve" placeholder="e.g. 22" class="w-full px-3 py-2 bg-gray-50 border border-gray-200 rounded-lg text-xs focus:outline-none focus:ring-2 focus:ring-brand-navy" required />
            </div>
          </div>
        </div>

        <!-- Additional Notes -->
        <div class="flex flex-col gap-2">
          <label class="text-xs font-bold text-gray-800 uppercase tracking-wider">4. Special Instructions & Customer Details</label>
          <input type="text" id="customer-name" placeholder="Your Full Name (e.g. Mrs. Folashade)" class="w-full px-3 py-2.5 mb-2 bg-gray-50 border border-gray-200 rounded-lg text-xs focus:outline-none focus:ring-2 focus:ring-brand-navy" required />
          <textarea id="special-notes" rows="3" placeholder="Specify necklines, zippers, slit lengths, or special fitting requests..." class="w-full px-3 py-2 bg-gray-50 border border-gray-200 rounded-lg text-xs focus:outline-none focus:ring-2 focus:ring-brand-navy"></textarea>
        </div>

        <!-- Submit Buttons -->
        <div class="flex flex-col gap-2 mt-3">
          <button type="submit" class="w-full py-3.5 bg-brand-navy hover:bg-brand-dark text-white font-bold text-xs rounded-xl shadow-md transition">
            Submit Custom Specification
          </button>
          
          <button type="button" onclick="sendCustomWhatsApp()" class="w-full py-3 bg-brand-whatsapp hover:bg-emerald-600 text-white font-bold text-xs rounded-xl shadow text-center flex items-center justify-center gap-2 transition">
            <i class="fa-brands fa-whatsapp text-lg"></i>
            <span>Send Details via WhatsApp</span>
          </button>
        </div>

      </form>

    </main>

    <!-- Bottom Navigation -->
    <nav class="fixed bottom-0 left-0 right-0 max-w-md md:max-w-4xl mx-auto bg-white border-t border-gray-200 px-4 py-2 flex items-center justify-around z-40 shadow-lg">
      <a href="home.html" class="flex flex-col items-center gap-0.5 text-gray-500 hover:text-brand-navy transition"><i class="fa-solid fa-house text-base"></i><span class="text-[10px]">Home</span></a>
      <a href="shop.html" class="flex flex-col items-center gap-0.5 text-gray-500 hover:text-brand-navy transition"><i class="fa-solid fa-bag-shopping text-base"></i><span class="text-[10px]">Shop</span></a>
      <a href="custom-order.html" class="flex flex-col items-center gap-0.5 text-amber-600 font-semibold"><i class="fa-solid fa-scissors text-base"></i><span class="text-[10px]">Custom Order</span></a>
      <a href="wishlist.html" class="flex flex-col items-center gap-0.5 text-gray-500 hover:text-brand-navy transition"><i class="fa-regular fa-heart text-base"></i><span class="text-[10px]">Wishlist</span></a>
      <a href="account.html" class="flex flex-col items-center gap-0.5 text-gray-500 hover:text-brand-navy transition"><i class="fa-regular fa-user text-base"></i><span class="text-[10px]">Account</span></a>
    </nav>

  </div>

  <!-- JavaScript Interaction Logic -->
  <script>
    let uploadedImageName = "No image attached";

    function selectOutfit(type, element) {
      document.querySelectorAll('.outfit-card').forEach(card => {
        card.classList.remove('border-brand-navy', 'bg-amber-50/50', 'shadow-sm');
        card.classList.add('border-gray-200');
        card.querySelector('input').checked = false;
      });
      element.classList.remove('border-gray-200');
      element.classList.add('border-brand-navy', 'bg-amber-50/50', 'shadow-sm');
      element.querySelector('input').checked = true;
    }

    function previewFile(input) {
      if (input.files && input.files[0]) {
        uploadedImageName = input.files[0].name;
        document.getElementById('upload-text').textContent = `Attached: ${uploadedImageName}`;
        document.getElementById('upload-icon').className = "fa-solid fa-image text-2xl text-emerald-600";
      }
    }

    function getCustomData() {
      const outfitType = document.querySelector('input[name="outfit_type"]:checked').value;
      const customerName = document.getElementById('customer-name').value || "Valued Customer";
      const bust = document.getElementById('m-bust').value || "N/A";
      const waist = document.getElementById('m-waist').value || "N/A";
      const hips = document.getElementById('m-hips').value || "N/A";
      const length = document.getElementById('m-length').value || "N/A";
      const shoulder = document.getElementById('m-shoulder').value || "N/A";
      const sleeve = document.getElementById('m-sleeve').value || "N/A";
      const notes = document.getElementById('special-notes').value || "None";

      return { outfitType, customerName, bust, waist, hips, length, shoulder, sleeve, notes, uploadedImageName };
    }

    function handleCustomSubmit(e) {
      e.preventDefault();
      const data = getCustomData();

      // Save to localStorage so Admin or Checkout can access it
      let customOrders = JSON.parse(localStorage.getItem("abbey_custom_orders") || "[]");
      customOrders.push({ ...data, date: new Date().toLocaleString() });
      localStorage.setItem("abbey_custom_orders", JSON.stringify(customOrders));

      alert(`✨ Success! Your custom ${data.outfitType} specification has been saved successfully. Our tailor will review your measurements.`);
      window.location.href = "home.html";
    }

    function sendCustomWhatsApp() {
      const data = getCustomData();
      const message = `Hello Abbey Stitches Empire! 👋\nI want to place a *Custom Sewing Order*:\n\n*Customer Name:* ${data.customerName}\n*Outfit Type:* ${data.outfitType}\n\n*Measurements (Inches):*\n• Bust/Chest: ${data.bust}"\n• Waist: ${data.waist}"\n• Hips: ${data.hips}"\n• Full Length: ${data.length}"\n• Shoulder: ${data.shoulder}"\n• Sleeve: ${data.sleeve}"\n\n*Special Notes:* ${data.notes}\n*Fabric Design File:* ${data.uploadedImageName}`;

      const whatsappUrl = `https://wa.me/2347051716739?text=${encodeURIComponent(message)}`;
      window.open(whatsappUrl, '_blank');
    }
  </script>
</body>
</html>
