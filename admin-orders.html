<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Abbey Stitches Empire | Orders Management</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&family=Playfair+Display:ital,wght@0,600;0,700;1,400&display=swap" rel="stylesheet" />

  <script>
    (function () {
      if (sessionStorage.getItem("admin_authenticated") !== "true") {
        const pin = prompt("🔒 Restricted Admin Access\nEnter Admin Passcode:");
        if (pin === "Abby@1") sessionStorage.setItem("admin_authenticated", "true");
        else { alert("❌ Access Denied!"); window.location.href = "home.html"; }
      }
    })();
  </script>

  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: { brand: { navy: '#06132b', dark: '#030a17', gold: '#d4af37' } },
          fontFamily: { sans: ['"Plus Jakarta Sans"', 'sans-serif'], serif: ['"Playfair Display"', 'serif'] }
        }
      }
    };
  </script>
</head>
<body class="bg-gray-100 font-sans antialiased text-gray-950 pb-24 md:pb-6">

  <div class="max-w-md md:max-w-6xl mx-auto bg-white min-h-screen shadow-xl relative overflow-hidden flex flex-col justify-between">

    <!-- Header -->
    <header class="sticky top-0 z-40 bg-brand-navy text-white px-4 py-3 flex items-center justify-between shadow-md">
      <div class="flex items-center gap-3">
        <a href="admin.html" class="text-gray-200 hover:text-white transition"><i class="fa-solid fa-arrow-left text-lg"></i></a>
        <h1 class="text-base font-bold font-serif text-amber-200">Customer Orders</h1>
      </div>
      <span id="order-count-badge" class="text-xs text-amber-400 font-bold">Loading...</span>
    </header>

    <!-- Content Container -->
    <main id="orders-container" class="p-4 md:p-6 flex-1 flex flex-col gap-4">
      <!-- Dynamically injected orders will appear here -->
    </main>

    <!-- Admin Navigation -->
    <nav class="fixed bottom-0 left-0 right-0 max-w-md md:max-w-6xl mx-auto bg-white border-t border-gray-200 px-4 py-2 flex items-center justify-around z-40 shadow-lg">
      <a href="admin.html" class="flex flex-col items-center gap-0.5 text-gray-500 hover:text-brand-navy transition"><i class="fa-solid fa-chart-pie text-base"></i><span class="text-[10px]">Dashboard</span></a>
      <a href="admin-products.html" class="flex flex-col items-center gap-0.5 text-gray-500 hover:text-brand-navy transition"><i class="fa-solid fa-box-archive text-base"></i><span class="text-[10px]">Products</span></a>
      <a href="admin-orders.html" class="flex flex-col items-center gap-0.5 text-amber-600 font-semibold"><i class="fa-solid fa-list-check text-base"></i><span class="text-[10px]">Orders</span></a>
      <a href="admin-customers.html" class="flex flex-col items-center gap-0.5 text-gray-500 hover:text-brand-navy transition"><i class="fa-solid fa-users text-base"></i><span class="text-[10px]">Customers</span></a>
      <a href="admin.html" class="flex flex-col items-center gap-0.5 text-gray-500 hover:text-brand-navy transition"><i class="fa-solid fa-gear text-base"></i><span class="text-[10px]">Settings</span></a>
    </nav>
  </div>

  <script>
    const defaultOrders = [
      {
        orderId: "#AS-94821",
        date: "Today, 2:45 PM",
        status: "Pending Payment",
        statusColor: "bg-amber-100 text-amber-800",
        customer: "John Doe",
        phone: "08012345678",
        address: "30, De-Morgan Street, Omisanjana, Ado-Ekiti",
        items: "Elegant Peplum Set (x1), Office Dress (x1)",
        total: 107000
      },
      {
        orderId: "#AS-94820",
        date: "Yesterday",
        status: "Processing",
        statusColor: "bg-blue-100 text-blue-800",
        customer: "Mrs. Akinware Olayinka",
        phone: "09153839111",
        address: "Akure, Ondo State",
        items: "Custom Ankara Gown (Custom Sewing)",
        total: 45000
      }
    ];

    function renderAdminOrders() {
      const container = document.getElementById('orders-container');
      const latestOrder = JSON.parse(localStorage.getItem("abbey_latest_order") || "null");
      const customOrders = JSON.parse(localStorage.getItem("abbey_custom_orders") || "[]");

      let allOrders = [...defaultOrders];

      if (latestOrder && latestOrder.orderId) {
        allOrders.unshift({
          orderId: latestOrder.orderId,
          date: latestOrder.date || "Just now",
          status: "Pending Verification",
          statusColor: "bg-amber-100 text-amber-800",
          customer: latestOrder.fullname,
          phone: latestOrder.phone || "07051716739",
          address: latestOrder.address || "Ado-Ekiti",
          items: `Cart Checkout (${latestOrder.itemCount || 3} items)`,
          total: latestOrder.grandTotal
        });
      }

      customOrders.forEach((co, idx) => {
        allOrders.unshift({
          orderId: `#CS-${8000 + idx}`,
          date: co.date || "Custom Request",
          status: "Custom Specification",
          statusColor: "bg-purple-100 text-purple-800",
          customer: co.customerName,
          phone: "07051716739",
          address: `Measurements: Bust ${co.bust}", Waist ${co.waist}"`,
          items: `${co.outfitType} (Notes: ${co.notes})`,
          total: 40000
        });
      });

      document.getElementById('order-count-badge').textContent = `${allOrders.length} Orders`;

      container.innerHTML = allOrders.map((ord) => {
        const cleanPhone = ord.phone.replace(/\D/g,'');
        const waPhone = cleanPhone.startsWith('0') ? '234' + cleanPhone.slice(1) : '234' + cleanPhone;

        return `
          <div class="bg-gray-50 border border-gray-200 rounded-2xl p-4 flex flex-col gap-3 shadow-sm">
            <div class="flex items-center justify-between border-b border-gray-200 pb-2 text-xs">
              <div>
                <span class="font-bold text-gray-900 font-mono">${ord.orderId}</span>
                <span class="text-[10px] text-gray-500 block">${ord.date}</span>
              </div>
              <span class="px-2.5 py-1 ${ord.statusColor} font-bold rounded-full text-[10px]">${ord.status}</span>
            </div>
            <div class="flex flex-col gap-1 text-xs text-gray-700">
              <p><span class="font-semibold text-gray-500">Customer:</span> ${ord.customer} (${ord.phone})</p>
              <p><span class="font-semibold text-gray-500">Address/Details:</span> ${ord.address}</p>
              <p><span class="font-semibold text-gray-500">Items:</span> ${ord.items}</p>
              <p class="font-extrabold text-brand-navy mt-1">Total: ₦${Number(ord.total).toLocaleString()}</p>
            </div>
            <div class="flex items-center gap-2 border-t border-gray-200 pt-3">
              <button onclick="alert('Order status updated successfully!')" class="flex-1 py-2 bg-emerald-600 hover:bg-emerald-700 text-white font-bold text-xs rounded-lg transition">Mark Paid & Processing</button>
              <a href="https://wa.me/${waPhone}?text=Hello%20${encodeURIComponent(ord.customer)},%20regarding%20your%20order%20${ord.orderId}..." target="_blank" class="py-2 px-3 bg-brand-navy text-amber-300 font-bold text-xs rounded-lg shadow"><i class="fa-brands fa-whatsapp"></i> Chat</a>
            </div>
          </div>
        `;
      }).join("");
    }

    renderAdminOrders();
  </script>
</body>
</html>
