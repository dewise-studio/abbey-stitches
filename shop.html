<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Abbey Stitches Empire | Shop Catalog</title>
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Font Awesome Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
  <!-- Google Fonts -->
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&family=Playfair+Display:ital,wght@0,600;0,700;1,400&display=swap" rel="stylesheet" />

  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            brand: {
              navy: '#06132b',
              dark: '#030a17',
              gold: '#d4af37',
              goldLight: '#f3e5ab'
            }
          },
          fontFamily: {
            sans: ['"Plus Jakarta Sans"', 'sans-serif'],
            serif: ['"Playfair Display"', 'serif']
          }
        }
      }
    };
  </script>
</head>
<body class="bg-gray-100 font-sans antialiased text-gray-900 pb-20 md:pb-6">

  <!-- Main Responsive Container -->
  <div class="max-w-md md:max-w-5xl mx-auto bg-white min-h-screen shadow-xl relative overflow-hidden">

    <!-- Header Section -->
    <header class="sticky top-0 z-40 bg-brand-navy text-white px-4 py-3 flex flex-col gap-3 shadow-md">
      <div class="flex items-center justify-between">
        <div class="flex items-center gap-3">
          <a href="home.html" class="text-gray-200 hover:text-white transition">
            <i class="fa-solid fa-arrow-left text-lg"></i>
          </a>
          <h1 class="text-base font-bold font-serif text-amber-200">Shop Catalog</h1>
        </div>
        
        <div class="flex items-center gap-4">
          <a href="cart.html" class="relative text-gray-200 hover:text-white transition">
            <i class="fa-solid fa-cart-shopping text-lg"></i>
            <span id="cart-badge" class="absolute -top-1.5 -right-2 bg-red-500 text-white text-[10px] font-bold w-4 h-4 rounded-full flex items-center justify-center">0</span>
          </a>
        </div>
      </div>

      <!-- Search Input -->
      <div class="relative w-full">
        <i class="fa-solid fa-magnifying-glass absolute left-3.5 top-1/2 -translate-y-1/2 text-gray-400 text-xs"></i>
        <input 
          type="text" 
          id="shop-search-input"
          onkeyup="filterShopCatalog()"
          placeholder="Search catalog by name or style..." 
          class="w-full pl-9 pr-4 py-2 bg-white text-gray-800 rounded-full text-xs focus:outline-none focus:ring-2 focus:ring-yellow-500 shadow-inner placeholder-gray-400"
        />
      </div>
    </header>

    <!-- Horizontal Category Filter Bar -->
    <div class="sticky top-[96px] z-30 bg-white border-b border-gray-200 px-4 py-2.5 overflow-x-auto scrollbar-none flex items-center gap-2 text-xs">
      <button onclick="filterByCategory('All', this)" class="cat-btn px-3.5 py-1.5 rounded-full bg-brand-navy text-white font-semibold whitespace-nowrap shadow-sm transition">All Items</button>
      <button onclick="filterByCategory('Ready-to-Wear', this)" class="cat-btn px-3.5 py-1.5 rounded-full bg-gray-100 text-gray-700 hover:bg-gray-200 font-medium whitespace-nowrap transition">Ready-to-Wear</button>
      <button onclick="filterByCategory('Ankara', this)" class="cat-btn px-3.5 py-1.5 rounded-full bg-gray-100 text-gray-700 hover:bg-gray-200 font-medium whitespace-nowrap transition">Ankara</button>
      <button onclick="filterByCategory('Gowns', this)" class="cat-btn px-3.5 py-1.5 rounded-full bg-gray-100 text-gray-700 hover:bg-gray-200 font-medium whitespace-nowrap transition">Gowns</button>
      <button onclick="filterByCategory('Corporate Wear', this)" class="cat-btn px-3.5 py-1.5 rounded-full bg-gray-100 text-gray-700 hover:bg-gray-200 font-medium whitespace-nowrap transition">Corporate Wear</button>
      <button onclick="filterByCategory('Accessories', this)" class="cat-btn px-3.5 py-1.5 rounded-full bg-gray-100 text-gray-700 hover:bg-gray-200 font-medium whitespace-nowrap transition">Accessories</button>
    </div>

    <!-- Product Display Grid -->
    <main class="p-4">
      <div id="shop-products-grid" class="grid grid-cols-2 md:grid-cols-3 gap-4">
        <!-- Dynamically injected items will appear here -->
      </div>
    </main>

    <!-- Bottom Navigation Bar -->
    <nav class="fixed bottom-0 left-0 right-0 max-w-md md:max-w-5xl mx-auto bg-white border-t border-gray-200 px-4 py-2 flex items-center justify-around z-40 shadow-lg">
      <a href="home.html" class="flex flex-col items-center gap-0.5 text-gray-500 hover:text-brand-navy transition">
        <i class="fa-solid fa-house text-base"></i>
        <span class="text-[10px]">Home</span>
      </a>
      <a href="shop.html" class="flex flex-col items-center gap-0.5 text-amber-600 font-semibold">
        <i class="fa-solid fa-bag-shopping text-base"></i>
        <span class="text-[10px]">Shop</span>
      </a>
      <a href="custom-order.html" class="flex flex-col items-center gap-0.5 text-gray-500 hover:text-brand-navy transition">
        <i class="fa-solid fa-scissors text-base"></i>
        <span class="text-[10px]">Custom Order</span>
      </a>
      <a href="wishlist.html" class="flex flex-col items-center gap-0.5 text-gray-500 hover:text-brand-navy transition">
        <i class="fa-regular fa-heart text-base"></i>
        <span class="text-[10px]">Wishlist</span>
      </a>
      <a href="account.html" class="flex flex-col items-center gap-0.5 text-gray-500 hover:text-brand-navy transition">
        <i class="fa-regular fa-user text-base"></i>
        <span class="text-[10px]">Account</span>
      </a>
    </nav>

  </div>

  <!-- Dynamic Render & Filtering Script -->
  <script>
    const defaultShopProducts = [
      { id: 1, title: "Elegant Peplum Set", category: "Corporate Wear", price: 35000, image: "scrn3.png" },
      { id: 2, title: "Chic Office Dress", category: "Corporate Wear", price: 32000, image: "scrn1.png" },
      { id: 3, title: "Ankara Flare Gown", category: "Ankara", price: 38000, image: "scrn2.png" },
      { id: 4, title: "Classy Two-Piece Set", category: "Ready-to-Wear", price: 30000, image: "scrn3.png" }
    ];

    let currentCategory = 'All';

    function getAllCatalogProducts() {
      const stored = JSON.parse(localStorage.getItem("abbey_products") || "[]");
      return [...stored, ...defaultShopProducts];
    }

    function renderCatalog(products) {
      const grid = document.getElementById("shop-products-grid");

      if (products.length === 0) {
        grid.innerHTML = `<div class="col-span-full py-16 text-center text-xs text-gray-400">No outfits found in this category or search query.</div>`;
        return;
      }

      grid.innerHTML = products.map(p => `
        <div class="bg-white rounded-xl overflow-hidden shadow-sm border border-gray-100 flex flex-col justify-between group">
          <div class="relative aspect-[3/4] bg-gray-100 overflow-hidden">
            <img src="${p.image}" alt="${p.title}" class="w-full h-full object-cover group-hover:scale-105 transition duration-500" onerror="this.src='scrn1.png'" />
            <span class="absolute top-2 left-2 px-2 py-0.5 bg-brand-navy/80 text-amber-300 font-bold text-[9px] rounded-full uppercase tracking-wider">${p.category}</span>
            <button class="absolute top-2 right-2 w-7 h-7 bg-white/80 rounded-full flex items-center justify-center text-gray-600 hover:text-red-500 transition shadow-sm">
              <i class="fa-regular fa-heart text-xs"></i>
            </button>
          </div>
          <div class="p-2.5 flex flex-col gap-1">
            <h4 class="text-xs font-semibold text-gray-800 truncate">${p.title}</h4>
            <p class="text-xs font-bold text-brand-navy">₦${Number(p.price).toLocaleString()}</p>
            <div class="flex items-center gap-1 text-[10px] text-amber-500">
              <i class="fa-solid fa-star"></i>
              <i class="fa-solid fa-star"></i>
              <i class="fa-solid fa-star"></i>
              <i class="fa-solid fa-star"></i>
              <i class="fa-solid fa-star"></i>
              <span class="text-gray-400 font-normal ml-0.5">(12)</span>
            </div>
          </div>
        </div>
      `).join("");
    }

    function filterByCategory(category, btnElement) {
      currentCategory = category;
      
      // Update active styling on category buttons
      document.querySelectorAll('.cat-btn').forEach(btn => {
        btn.classList.remove('bg-brand-navy', 'text-white', 'shadow-sm');
        btn.classList.add('bg-gray-100', 'text-gray-700');
      });
      btnElement.classList.remove('bg-gray-100', 'text-gray-700');
      btnElement.classList.add('bg-brand-navy', 'text-white', 'shadow-sm');

      filterShopCatalog();
    }

    function filterShopCatalog() {
      const query = document.getElementById("shop-search-input").value.toLowerCase().trim();
      let all = getAllCatalogProducts();

      // Filter by category
      if (currentCategory !== 'All') {
        all = all.filter(p => p.category.toLowerCase() === currentCategory.toLowerCase());
      }

      // Filter by search query
      if (query) {
        all = all.filter(p => p.title.toLowerCase().includes(query) || p.category.toLowerCase().includes(query));
      }

      renderCatalog(all);
    }

    // Initialize cart badge and render full catalog on load
    const cart = JSON.parse(localStorage.getItem("abbey_cart") || "[]");
    let totalCartCount = 0;
    cart.forEach(item => totalCartCount += (item.quantity || 1));
    document.getElementById("cart-badge").innerText = totalCartCount;

    renderCatalog(getAllCatalogProducts());
  </script>
</body>
</html>
