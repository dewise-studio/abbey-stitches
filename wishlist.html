<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Abbey Stitches Empire | My Wishlist</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&family=Playfair+Display:ital,wght@0,600;0,700;1,400&display=swap" rel="stylesheet" />
  <script>
    tailwind.config = { theme: { extend: { colors: { brand: { navy: '#06132b', dark: '#030a17', gold: '#d4af37' } } } } };
  </script>
</head>
<body class="bg-gray-100 font-sans antialiased text-gray-900 pb-24 md:pb-6">
  <div class="max-w-md md:max-w-5xl mx-auto bg-white min-h-screen shadow-xl relative overflow-hidden flex flex-col justify-between">
    
    <!-- Header -->
    <header class="sticky top-0 z-40 bg-brand-navy text-white px-4 py-3 flex items-center justify-between shadow-md">
      <div class="flex items-center gap-3">
        <a href="home.html" class="text-gray-200 hover:text-white transition"><i class="fa-solid fa-arrow-left text-lg"></i></a>
        <h1 class="text-base font-bold font-serif text-amber-200">My Wishlist</h1>
      </div>
      <a href="cart.html" class="relative text-gray-200 hover:text-white transition">
        <i class="fa-solid fa-cart-shopping text-lg"></i>
        <span id="cart-badge" class="absolute -top-1.5 -right-2 bg-red-500 text-white text-[10px] font-bold w-4 h-4 rounded-full flex items-center justify-center">0</span>
      </a>
    </header>

    <!-- Wishlist Grid -->
    <main class="p-4 flex-1">
      <div id="wishlist-grid" class="grid grid-cols-2 md:grid-cols-3 gap-4">
        <!-- Dynamically injected wishlist items appear here -->
      </div>
    </main>

    <!-- Bottom Navigation -->
    <nav class="fixed bottom-0 left-0 right-0 max-w-md md:max-w-5xl mx-auto bg-white border-t border-gray-200 px-4 py-2 flex items-center justify-around z-40 shadow-lg">
      <a href="home.html" class="flex flex-col items-center gap-0.5 text-gray-500 hover:text-brand-navy transition"><i class="fa-solid fa-house text-base"></i><span class="text-[10px]">Home</span></a>
      <a href="shop.html" class="flex flex-col items-center gap-0.5 text-gray-500 hover:text-brand-navy transition"><i class="fa-solid fa-bag-shopping text-base"></i><span class="text-[10px]">Shop</span></a>
      <a href="custom-order.html" class="flex flex-col items-center gap-0.5 text-gray-500 hover:text-brand-navy transition"><i class="fa-solid fa-scissors text-base"></i><span class="text-[10px]">Custom Order</span></a>
      <a href="wishlist.html" class="flex flex-col items-center gap-0.5 text-amber-600 font-semibold"><i class="fa-solid fa-heart text-base"></i><span class="text-[10px]">Wishlist</span></a>
      <a href="account.html" class="flex flex-col items-center gap-0.5 text-gray-500 hover:text-brand-navy transition"><i class="fa-regular fa-user text-base"></i><span class="text-[10px]">Account</span></a>
    </nav>
  </div>

  <script>
    const defaultWishlist = [
      { id: 101, title: "Elegant Peplum Set", price: 35000, category: "Corporate Wear", image: "scrn3.png" },
      { id: 102, title: "Ankara Flare Gown", price: 38000, category: "Ankara", image: "scrn2.png" }
    ];

    function renderWishlist() {
      const stored = JSON.parse(localStorage.getItem("abbey_wishlist") || "null");
      const wishlist = stored === null ? defaultWishlist : stored;
      const grid = document.getElementById("wishlist-grid");

      if (wishlist.length === 0) {
        grid.innerHTML = `
          <div class="col-span-full py-20 text-center flex flex-col items-center gap-3">
            <div class="w-16 h-16 rounded-full bg-red-50 text-red-500 flex items-center justify-center text-2xl">
              <i class="fa-regular fa-heart"></i>
            </div>
            <h3 class="text-sm font-bold text-gray-800">Your wishlist is empty</h3>
            <p class="text-xs text-gray-500 max-w-[220px]">Save your favorite outfits while exploring the shop.</p>
            <a href="shop.html" class="mt-2 px-5 py-2.5 bg-brand-navy text-amber-200 font-bold text-xs rounded-xl shadow">Explore Shop</a>
          </div>
        `;
        return;
      }

      grid.innerHTML = wishlist.map((item, index) => `
        <div class="bg-white rounded-xl overflow-hidden shadow-sm border border-gray-100 flex flex-col justify-between group">
          <div class="relative aspect-[3/4] bg-gray-100 overflow-hidden">
            <img src="${item.image || 'scrn1.png'}" alt="${item.title}" class="w-full h-full object-cover group-hover:scale-105 transition duration-500" onerror="this.src='scrn1.png'" />
            <button onclick="removeFromWishlist(${index})" class="absolute top-2 right-2 w-7 h-7 bg-white/90 rounded-full flex items-center justify-center text-red-500 shadow-sm hover:scale-110 transition"><i class="fa-solid fa-heart text-xs"></i></button>
          </div>
          <div class="p-2.5 flex flex-col gap-1">
            <h4 class="text-xs font-semibold text-gray-800 truncate">${item.title}</h4>
            <p class="text-xs font-bold text-brand-navy">₦${Number(item.price).toLocaleString()}</p>
            <button onclick="moveToCart(${index})" class="mt-1 w-full py-1.5 bg-brand-navy hover:bg-brand-dark text-white text-[10px] font-bold rounded-lg shadow-sm transition">Move to Cart</button>
          </div>
        </div>
      `).join("");
    }

    function removeFromWishlist(index) {
      let stored = JSON.parse(localStorage.getItem("abbey_wishlist") || "null");
      let wishlist = stored === null ? defaultWishlist : stored;
      wishlist.splice(index, 1);
      localStorage.setItem("abbey_wishlist", JSON.stringify(wishlist));
      renderWishlist();
    }

    function moveToCart(index) {
      let stored = JSON.parse(localStorage.getItem("abbey_wishlist") || "null");
      let wishlist = stored === null ? defaultWishlist : stored;
      let item = wishlist[index];

      // Add to cart
      let cart = JSON.parse(localStorage.getItem("abbey_cart") || "[]");
      const existing = cart.find(c => c.title === item.title);
      if (existing) {
        existing.quantity = (existing.quantity || 1) + 1;
      } else {
        cart.push({ ...item, quantity: 1 });
      }
      localStorage.setItem("abbey_cart", JSON.stringify(cart));

      // Remove from wishlist
      wishlist.splice(index, 1);
      localStorage.setItem("abbey_wishlist", JSON.stringify(wishlist));

      updateCartBadge();
      renderWishlist();
      alert(`"${item.title}" has been moved to your cart!`);
    }

    function updateCartBadge() {
      const cart = JSON.parse(localStorage.getItem("abbey_cart") || "[]");
      let count = 0;
      cart.forEach(i => count += (i.quantity || 1));
      document.getElementById("cart-badge").innerText = count;
    }

    updateCartBadge();
    renderWishlist();
  </script>
</body>
</html>
